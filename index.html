<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthday Surprise</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Great+Vibes&family=Outfit:wght@200;300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --script:'Great Vibes','Brush Script MT',cursive;
  --hand:'Caveat','Segoe Print',cursive;
  --ui:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent
}

html,body{
  height:100%;
  overflow:hidden;
  background:#2a0510;
  font-family:var(--ui);
  color:#fff
}

button{
  font:inherit;
  color:inherit;
  border:0;
  cursor:pointer;
  background:none
}

.page{
  position:fixed;
  inset:0;
  overflow-y:auto;
  overflow-x:hidden;
  opacity:0;
  visibility:hidden;
  transform:scale(.96);
  filter:blur(10px);
  transition:
    opacity .9s ease,
    transform .9s ease,
    filter .9s ease,
    visibility 0s .9s;
  z-index:1
}

.page.active{
  opacity:1;
  visibility:visible;
  transform:none;
  filter:none;
  transition-delay:0s;
  z-index:2
}

.floaters{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none
}

.floaters span{
  position:absolute;
  bottom:-40px;
  animation:rise linear infinite;
  opacity:0
}

@keyframes rise{
  0%{
    transform:translateY(0) rotate(0);
    opacity:0
  }
  10%{
    opacity:var(--o,.3)
  }
  100%{
    transform:translateY(-115vh) rotate(40deg);
    opacity:0
  }
}


/* =========================
   PAGE 1
========================= */

#p1{
  background:
    radial-gradient(
      ellipse at 28% 42%,
      #8a1536 0%,
      #4d0c20 55%,
      #260510 100%
    )
}

.lock{
  position:relative;
  min-height:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  justify-items:center;
  gap:2rem;
  padding:2rem max(4vw,1rem)
}

.polaroid{
  position:relative;
  width:min(340px,80%);
  background:#fdf9f3;
  padding:14px 14px 70px;
  transform:rotate(-4deg);
  box-shadow:
    0 30px 60px rgba(0,0,0,.55),
    0 4px 10px rgba(0,0,0,.3);
  transition:transform .6s
}

.polaroid:hover{
  transform:rotate(-1deg) scale(1.02)
}

.polaroid::before{
  content:"";
  position:absolute;
  top:-16px;
  left:50%;
  width:110px;
  height:32px;
  transform:translateX(-50%) rotate(3deg);
  background:rgba(255,226,180,.55);
  box-shadow:0 1px 3px rgba(0,0,0,.2)
}

.polaroid img{
  display:block;
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  background:#ddd
}

.polaroid p{
  position:absolute;
  left:0;
  right:0;
  bottom:14px;
  text-align:center;
  font:700 2.1rem/1 var(--hand);
  color:#5a1a28
}

.pad{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:min(360px,100%)
}

.lockicon{
  font-size:3.4rem;
  animation:bob 3s ease-in-out infinite;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))
}

@keyframes bob{
  50%{
    transform:translateY(-6px)
  }
}

.pad h1{
  font-weight:300;
  font-size:1.05rem;
  letter-spacing:.28em;
  margin:.9rem 0 1.4rem
}

.dots{
  display:flex;
  gap:16px
}

.dots i{
  width:15px;
  height:15px;
  border-radius:50%;
  border:1.5px solid rgba(255,255,255,.85);
  transition:
    background .15s,
    transform .15s
}

.dots i.on{
  background:#fff;
  transform:scale(1.15)
}

.dots.shake{
  animation:shake .5s
}

@keyframes shake{
  20%,60%{
    transform:translateX(-12px)
  }
  40%,80%{
    transform:translateX(12px)
  }
}

.msg{
  min-height:1.6rem;
  margin:.9rem 0 .6rem;
  font-size:.95rem;
  color:#ffd0da;
  opacity:0;
  transition:opacity .3s
}

.msg.show{
  opacity:1
}

.keys{
  display:grid;
  grid-template-columns:repeat(3,auto);
  gap:clamp(12px,3.5vw,18px)
}

.key{
  width:clamp(62px,18vw,78px);
  height:clamp(62px,18vw,78px);
  border-radius:50%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(8px);
  transition:
    transform .12s,
    background .25s
}

.key b{
  font-weight:300;
  font-size:1.9rem;
  line-height:1
}

.key small{
  font-size:.55rem;
  letter-spacing:.2em;
  min-height:.7rem;
  opacity:.7;
  margin-top:2px
}

.key:active{
  background:rgba(255,255,255,.38);
  transform:scale(.92);
  transition:none
}

.key.fn{
  background:transparent;
  border-color:transparent
}

@media(max-width:820px){
  .lock{
    grid-template-columns:1fr;
    gap:2.4rem;
    padding-top:2.4rem
  }

  .polaroid{
    width:min(240px,62vw);
    padding-bottom:58px
  }

  .polaroid p{
    font-size:1.7rem
  }
}


/* =========================
   PAGE 2
========================= */

#p2{
  background:
    radial-gradient(
      ellipse at 50% 120%,
      #2b1a52 0%,
      #10123a 35%,
      #060818 70%,
      #02030a 100%
    );
  overflow:hidden
}

.band{
  position:absolute;
  inset:-20% -20%;
  background:
    linear-gradient(
      115deg,
      transparent 38%,
      rgba(150,130,255,.08) 48%,
      rgba(255,180,220,.06) 54%,
      transparent 64%
    );
  filter:blur(30px)
}

.moon{
  position:absolute;
  top:7%;
  right:9%;
  width:clamp(34px,6vw,56px);
  aspect-ratio:1;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 35% 35%,
      #fffbe8,
      #e9dfb5 60%,
      #b9ae82
    );
  box-shadow:
    0 0 40px 10px rgba(255,245,200,.25),
    0 0 120px 40px rgba(255,245,200,.1)
}

.star{
  position:absolute;
  border-radius:50%;
  background:#fff;
  animation:tw ease-in-out infinite
}

@keyframes tw{
  0%,100%{
    opacity:.15;
    transform:scale(.7)
  }
  50%{
    opacity:1;
    transform:scale(1.2)
  }
}

#fw{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none
}

.title{
  position:absolute;
  left:0;
  right:0;
  top:50%;
  transform:translateY(-50%);
  text-align:center;
  padding:0 1rem;
  opacity:0;
  z-index:3;
  font:400 clamp(2.6rem,8vw,5.2rem)/1.15 var(--script);
  color:#fff0f4;
  text-shadow:0 0 24px rgba(255,150,190,.7);
  transition:
    opacity 1.2s ease .8s,
    top 1.4s cubic-bezier(.65,0,.25,1),
    transform 1.4s cubic-bezier(.65,0,.25,1),
    font-size 1.4s
}

#p2.active .title{
  opacity:1
}

.title.up{
  top:max(5vh,28px);
  transform:none;
  font-size:clamp(2rem,6vw,3.2rem)
}

.title.pop{
  animation:pop .9s cubic-bezier(.3,1.5,.5,1)
}

@keyframes pop{
  0%{
    opacity:0;
    scale:.7
  }
  100%{
    opacity:1;
    scale:1
  }
}

.stage{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1.1rem;
  padding-top:9vh;
  z-index:2;
  pointer-events:none
}

.stage.show{
  pointer-events:auto
}

.cake{
  position:relative;
  width:min(78vw,350px,46dvh);
  opacity:0;
  transform:translateY(70px) scale(.8);
  transition:
    opacity 1.4s ease,
    transform 1.6s cubic-bezier(.2,1.2,.4,1)
}

.stage.show .cake{
  opacity:1;
  transform:none
}

.cake svg{
  display:block;
  width:100%;
  overflow:visible;
  transition:filter 1s
}

.cake.lit svg{
  filter:
    drop-shadow(0 0 26px rgba(255,170,80,.55))
    drop-shadow(0 0 60px rgba(255,120,60,.3))
}

.halo{
  opacity:0;
  transition:opacity 1s
}

.lit .halo{
  opacity:1;
  animation:breathe 2.4s ease-in-out infinite
}

@keyframes breathe{
  50%{
    opacity:.6
  }
}

.fw1{
  transform-box:fill-box;
  transform-origin:50% 100%;
  transform:scale(0);
  opacity:0;
  transition:
    transform .7s cubic-bezier(.3,1.7,.5,1),
    opacity .4s
}

.lit .fw1{
  transform:scale(1);
  opacity:1
}

.fw2{
  transform-box:fill-box;
  transform-origin:50% 100%;
  animation:flick 1.1s ease-in-out infinite
}

.fw3{
  transform-box:fill-box;
  transform-origin:50% 100%;
  animation:flick .73s ease-in-out infinite reverse
}

@keyframes flick{
  0%,100%{
    transform:scale(1,1) skewX(0)
  }
  20%{
    transform:scale(.93,1.07) skewX(-3deg)
  }
  45%{
    transform:scale(1.05,.93) skewX(2.5deg)
  }
  70%{
    transform:scale(.96,1.05) skewX(-1.5deg)
  }
}

.btn{
  pointer-events:auto;
  border-radius:999px;
  font-weight:600;
  letter-spacing:.12em;
  transition:
    transform .2s,
    opacity .5s,
    box-shadow .3s
}

.fire{
  padding:1rem 3rem;
  font-size:1.3rem;
  background:
    linear-gradient(
      135deg,
      #ff8a2b,
      #ff3d4f 60%,
      #d4145a
    );
  box-shadow:
    0 8px 30px rgba(255,80,60,.5),
    inset 0 1px 0 rgba(255,255,255,.4);
  opacity:0;
  animation:none
}

.stage.show .fire{
  opacity:1;
  animation:pulse 2s ease-in-out 1.5s infinite
}

.fire:active{
  transform:scale(.94)
}

.fire:disabled{
  animation:none!important;
  opacity:.45!important;
  cursor:default;
  box-shadow:none
}

@keyframes pulse{
  50%{
    box-shadow:
      0 8px 46px rgba(255,100,60,.85),
      inset 0 1px 0 rgba(255,255,255,.4);
    transform:scale(1.04)
  }
}

.next{
  padding:.8rem 2.2rem;
  font-size:1.05rem;
  background:rgba(255,255,255,.14);
  border:1.5px solid rgba(255,255,255,.7);
  backdrop-filter:blur(8px);
  opacity:0;
  transform:translateY(14px);
  pointer-events:none
}

.next.show{
  opacity:1;
  transform:none;
  pointer-events:auto
}

.next:hover{
  background:rgba(255,255,255,.28)
}


/* =========================
   PAGE 3
========================= */

#p3{
  background:
    radial-gradient(
      circle at 15% 10%,
      #ffe0ea 0,
      transparent 45%
    ),
    radial-gradient(
      circle at 90% 90%,
      #ffd6c9 0,
      transparent 45%
    ),
    linear-gradient(
      160deg,
      #fff4ec,
      #ffe6ee
    );
  color:#5a1a28
}

.wrap{
  position:relative;
  min-height:100%;
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:minmax(0,5fr) minmax(0,6fr);
  gap:clamp(1.5rem,5vw,4rem);
  align-items:center;
  padding:2rem 1.2rem
}

.photoCol{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1.4rem
}

.photo{
  width:clamp(210px,34vw,370px);
  aspect-ratio:1;
  border-radius:50%;
  border:10px solid #fff;
  overflow:hidden;
  box-shadow:
    0 18px 50px rgba(179,54,90,.3),
    0 0 0 6px rgba(255,255,255,.5);
  background:#f4c6d2
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.letter{
  position:relative;
  background:#fffaf4;
  border-radius:22px;
  padding:clamp(1.4rem,3vw,2.4rem);
  box-shadow:
    0 24px 60px rgba(179,54,90,.2),
    0 2px 6px rgba(0,0,0,.06)
}

/* READ-ONLY MESSAGE */
.letter .message{
  width:100%;
  min-height:clamp(290px,46vh,420px);
  color:#4a1624;
  font:500 1.6rem/2.1rem var(--hand);
  white-space:pre-wrap;
  padding:.2rem .3rem;
  background-image:
    repeating-linear-gradient(
      transparent 0 calc(2.1rem - 1px),
      rgba(179,54,90,.2) calc(2.1rem - 1px) 2.1rem
    );
}

.letter h2{
  font:400 clamp(2.6rem,6vw,4rem)/1.1 var(--script);
  color:#b3365a;
  margin-bottom:.8rem;
  text-align:center
}

#p3.active .photoCol{
  animation:inL 1.1s cubic-bezier(.2,.9,.3,1) .2s both
}

#p3.active .letter{
  animation:inR 1.1s cubic-bezier(.2,.9,.3,1) .45s both
}

@keyframes inL{
  from{
    opacity:0;
    transform:translateX(-60px)
  }
}

@keyframes inR{
  from{
    opacity:0;
    transform:translateX(60px)
  }
}

@media(max-width:820px){
  .wrap{
    grid-template-columns:1fr;
    padding-top:2.4rem
  }
}

@media(prefers-reduced-motion:reduce){
  .floaters span,
  .lockicon,
  .star{
    animation:none
  }
}
</style>
</head>

<body>


<!-- =========================
     PAGE 1: LOCK SCREEN
========================= -->

<section class="page active" id="p1">

  <div class="floaters" id="fl1"></div>

  <div class="lock">

    <figure class="polaroid">
      <img src="amma1.jpg" data-ph="🎂" alt="Birthday photo">
      <p id="caption"></p>
    </figure>

    <div class="pad">

      <div class="lockicon">🔐</div>

      <h1>ENTER A PASSCODE</h1>

      <div class="dots" id="dots"></div>

      <div class="msg" id="wrong" role="alert">
        Wrong password 😝
      </div>

      <div class="keys" id="keys"></div>

    </div>

  </div>

</section>


<!-- =========================
     PAGE 2: NIGHT SKY + CAKE
========================= -->

<section class="page" id="p2">

  <div class="band"></div>
  <div class="moon"></div>
  <div id="stars"></div>

  <canvas id="fw"></canvas>

  <h2 class="title" id="p2title">
    A Little Surprise For You ✨
  </h2>

  <div class="stage" id="stage">

    <div class="cake" id="cake">

      <svg viewBox="0 0 300 320" aria-label="Birthday cake with one candle">

        <defs>

          <radialGradient id="halo">
            <stop offset="0" stop-color="#ffd27a" stop-opacity=".95"/>
            <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
          </radialGradient>

          <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#ff4b1f"/>
            <stop offset=".55" stop-color="#ffae3a"/>
            <stop offset="1" stop-color="#fff3a6"/>
          </linearGradient>

        </defs>

        <circle
          class="halo"
          cx="150"
          cy="44"
          r="80"
          fill="url(#halo)"
        />

        <ellipse
          cx="150"
          cy="298"
          rx="138"
          ry="13"
          fill="#000"
          opacity=".25"
        />

        <ellipse
          cx="150"
          cy="290"
          rx="138"
          ry="14"
          fill="#f6e9e4"
        />

        <rect
          x="40"
          y="222"
          width="220"
          height="64"
          rx="12"
          fill="#6b2535"
        />

        <rect
          x="40"
          y="222"
          width="220"
          height="14"
          rx="7"
          fill="#ffe6ec"
        />

        <g id="d1" fill="#ffe6ec"></g>
        <g id="s1"></g>

        <rect
          x="68"
          y="160"
          width="164"
          height="64"
          rx="12"
          fill="#f08ca4"
        />

        <rect
          x="68"
          y="160"
          width="164"
          height="13"
          rx="6.5"
          fill="#fff"
        />

        <g id="d2" fill="#fff"></g>
        <g id="s2"></g>

        <rect
          x="100"
          y="110"
          width="100"
          height="52"
          rx="12"
          fill="#b8324f"
        />

        <rect
          x="100"
          y="110"
          width="100"
          height="12"
          rx="6"
          fill="#fff6ef"
        />

        <g id="d3" fill="#fff6ef"></g>
        <g id="s3"></g>

        <circle
          cx="120"
          cy="106"
          r="7"
          fill="#d4143a"
        />

        <circle
          cx="180"
          cy="106"
          r="7"
          fill="#d4143a"
        />

        <path
          d="M120 99q4-8 9-9"
          stroke="#3b7a3b"
          stroke-width="2"
          fill="none"
        />

        <path
          d="M180 99q4-8 9-9"
          stroke="#3b7a3b"
          stroke-width="2"
          fill="none"
        />

        <rect
          x="144"
          y="66"
          width="12"
          height="46"
          rx="3"
          fill="#fff"
        />

        <rect
          x="144"
          y="76"
          width="12"
          height="5"
          fill="#ff7aa0"
        />

        <rect
          x="144"
          y="88"
          width="12"
          height="5"
          fill="#ff7aa0"
        />

        <rect
          x="144"
          y="100"
          width="12"
          height="5"
          fill="#ff7aa0"
        />

        <path
          d="M150 66q2-5 0-9"
          stroke="#3a2a2a"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"
        />

        <g class="fw1">
          <g class="fw2">
            <g class="fw3">

              <path
                d="M150 20C159 34 168 44 150 58C132 44 141 34 150 20Z"
                fill="url(#fl)"
              />

              <path
                d="M150 36C155 43 158 48 150 57C142 48 145 43 150 36Z"
                fill="#fff8d0"
                opacity=".95"
              />

            </g>
          </g>
        </g>

      </svg>

    </div>

    <button class="btn fire" id="fire">
      🔥 FIRE
    </button>

    <button class="btn next" id="next">
      NEXT ➜
    </button>

  </div>

</section>


<!-- =========================
     PAGE 3: PHOTO + READ ONLY LETTER
========================= -->

<section class="page" id="p3">

  <div class="floaters" id="fl3"></div>

  <div class="wrap">

    <div class="photoCol">

      <!--
        IMPORTANT:
        Put your person's photo in the same folder
        and name it: person.jpg
      -->

      <div class="photo">
        <img
          id="person"
          src="amma.jpg"
          alt="Birthday person"
        >
      </div>

    </div>

    <article class="letter">

      <h2 id="heading"></h2>

      <!-- READ ONLY -->
      <div
        id="msg"
        class="message"
      ></div>

    </article>

  </div>

</section>


<script>

/* =====================================================
   EASY CUSTOMIZATION
   ===================================================== */

const CONFIG = {

  /* PASSWORD */
  passcode: "0710",

  /* PERSON'S NAME */
  name: "Amma",

  /* FIRST PAGE PHOTO CAPTION */
  lockCaption: "Happy Birthday 🎂❤️",

  /* PAGE 2 TITLE */
  surpriseText: "A Little Surprise For You ✨",

  /* CAKE TITLE */
  wishText: "Make a Wish! 🎂✨",

  /* FINAL PAGE TITLE */
  title: "Happy Birthday ❤️",

  /* FINAL BIRTHDAY MESSAGE */
  message: n => `Dear ${n},

Wishing you a very Happy Birthday! 🎂❤️

May your life always be filled with happiness, love and beautiful moments.

Have a wonderful day! ✨

With lots of love ❤️`

};


/* =====================================================
   BASIC HELPERS
   ===================================================== */

const $ = id => document.getElementById(id);

const rand = (a,b) =>
  a + Math.random() * (b-a);


/* =====================================================
   INSERT CONFIG TEXT
   ===================================================== */

$('caption').textContent =
  CONFIG.lockCaption;

$('p2title').textContent =
  CONFIG.surpriseText;

$('heading').textContent =
  CONFIG.title;


/*
   IMPORTANT:
   textContent is used instead of textarea.value.
   Therefore the birthday message is READ ONLY.
*/

$('msg').textContent =
  CONFIG.message(CONFIG.name);


/* =====================================================
   IMAGE FALLBACK
   ===================================================== */

const placeholder = e =>
  'data:image/svg+xml,' +
  encodeURIComponent(`
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 400 500">

      <defs>

        <linearGradient
          id="g"
          x1="0"
          y1="0"
          x2="1"
          y2="1">

          <stop stop-color="#ff9aa9"/>

          <stop
            offset="1"
            stop-color="#8e2347"/>

        </linearGradient>

      </defs>

      <rect
        width="400"
        height="500"
        fill="url(#g)"
      />

      <text
        x="200"
        y="285"
        font-size="130"
        text-anchor="middle">
        ${e}
      </text>

    </svg>
  `);


document.querySelectorAll('img[data-ph]')
.forEach(img => {

  const fb = () => {

    img.onerror = null;

    img.src =
      placeholder(
        img.dataset.ph
      );

  };

  img.onerror = fb;

  if(
    img.complete &&
    !img.naturalWidth
  ){
    fb();
  }

});


/* =====================================================
   FLOATING HEARTS / PETALS
   ===================================================== */

function floaters(
  el,
  list,
  n,
  op
){

  for(
    let i=0;
    i<n;
    i++
  ){

    const s =
      document.createElement('span');

    s.textContent =
      list[i % list.length];

    s.style.cssText = `
      left:${rand(0,100)}%;
      font-size:${rand(14,34)}px;
      animation-duration:${rand(9,18)}s;
      animation-delay:${rand(-18,0)}s;
      --o:${op};
    `;

    el.appendChild(s);

  }

}


floaters(
  $('fl1'),
  ['❤️','💗','✨','🌹'],
  16,
  .28
);

floaters(
  $('fl3'),
  ['🌸','💗','✨','🎀'],
  18,
  .45
);


/* =====================================================
   PAGE SWITCHING
   ===================================================== */

const go = id => {

  document
    .querySelectorAll('.page')
    .forEach(
      p =>
        p.classList.toggle(
          'active',
          p.id === id
        )
    );

};


/* =====================================================
   PAGE 1: PASSCODE
   ===================================================== */

const dotCount =
  Math.max(
    6,
    CONFIG.passcode.length
  );

const dotsEl =
  $('dots');


for(
  let i=0;
  i<dotCount;
  i++
){

  dotsEl.appendChild(
    document.createElement('i')
  );

}


const keyDefs = [

  ['1',''],
  ['2','ABC'],
  ['3','DEF'],
  ['4','GHI'],
  ['5','JKL'],
  ['6','MNO'],
  ['7','PQRS'],
  ['8','TUV'],
  ['9','WXYZ'],
  ['*',''],
  ['0','+'],
  ['⌫','']

];


keyDefs.forEach(
  ([k,sub]) => {

    const b =
      document.createElement('button');

    b.className =
      'key' +
      (
        k === '*' ||
        k === '⌫'
          ? ' fn'
          : ''
      );

    b.innerHTML = `
      <b>${k}</b>
      <small>${sub}</small>
    `;

    b.setAttribute(
      'aria-label',
      k === '⌫'
        ? 'Delete'
        : k
    );

    b.addEventListener(
      'click',
      () => press(k)
    );

    $('keys').appendChild(b);

  }
);


let entry = '';
let locked = false;


function paintDots(){

  [
    ...dotsEl.children
  ]
  .forEach(
    (d,i) =>
      d.classList.toggle(
        'on',
        i < entry.length
      )
  );

}


function press(k){

  if(locked) return;

  if(k === '⌫'){

    entry =
      entry.slice(0,-1);

  }

  else if(
    entry.length <
    dotCount
  ){

    entry += k;

  }

  paintDots();

  if(
    entry.length ===
    CONFIG.passcode.length
  ){

    locked = true;

    setTimeout(
      check,
      220
    );

  }

}


function check(){

  if(
    entry ===
    CONFIG.passcode
  ){

    go('p2');

    startSurprise();

  }

  else{

    $('wrong')
      .classList
      .add('show');

    dotsEl
      .classList
      .add('shake');

    setTimeout(
      () => {

        entry = '';

        paintDots();

        dotsEl
          .classList
          .remove('shake');

        locked = false;

      },
      550
    );

    setTimeout(
      () =>
        $('wrong')
          .classList
          .remove('show'),
      1800
    );

  }

}


addEventListener(
  'keydown',
  e => {

    if(
      !$('p1')
        .classList
        .contains('active')
    ) return;

    if(
      /^[0-9*]$/.test(e.key)
    ){

      press(e.key);

    }

    else if(
      e.key === 'Backspace'
    ){

      press('⌫');

    }

  }
);


/* =====================================================
   PAGE 2: STARS
   ===================================================== */

(function buildStars(){

  const box =
    $('stars');

  for(
    let i=0;
    i<140;
    i++
  ){

    const s =
      document.createElement('div');

    const z =
      rand(1,2.8);

    s.className =
      'star';

    s.style.cssText = `
      left:${rand(0,100)}%;
      top:${rand(0,100)}%;
      width:${z}px;
      height:${z}px;
      animation-duration:${rand(2,6)}s;
      animation-delay:${rand(-6,0)}s;
    `;

    box.appendChild(s);

  }

})();


/* =====================================================
   BUILD CAKE DECORATIONS
   ===================================================== */

(function buildCake(){

  const NS =
    'http://www.w3.org/2000/svg';

  const add =
    (id,tag,attrs) => {

      const e =
        document.createElementNS(
          NS,
          tag
        );

      for(
        const k in attrs
      ){

        e.setAttribute(
          k,
          attrs[k]
        );

      }

      $(id).appendChild(e);

    };


  const tiers = [

    [
      1,
      40,
      260,
      232,
      16,
      250,
      282
    ],

    [
      2,
      68,
      232,
      170,
      14,
      182,
      218
    ],

    [
      3,
      100,
      200,
      120,
      12,
      128,
      156
    ]

  ];


  const cols = [
    '#ffd166',
    '#6bd6ff',
    '#9bf06b',
    '#ff9bd0',
    '#ffffff'
  ];


  tiers.forEach(
    ([
      n,
      x0,
      x1,
      y,
      gap,
      sy0,
      sy1
    ]) => {

      for(
        let x=x0+14;
        x<x1-8;
        x+=gap+6
      ){

        add(
          'd'+n,
          'rect',
          {
            x:x-5,
            y:y-8,
            width:10,
            height:10+rand(0,12),
            rx:5
          }
        );

      }


      for(
        let i=0;
        i<16;
        i++
      ){

        add(
          's'+n,
          'rect',
          {
            x:rand(
              x0+8,
              x1-8
            ),
            y:rand(
              sy0,
              sy1
            ),
            width:5,
            height:2,
            rx:1,
            fill:
              cols[i%5],
            transform:
              `rotate(${rand(0,180)} ${x0} ${sy0})`
          }
        );

      }

    }
  );

})();


/* =====================================================
   FIREWORKS
   ===================================================== */

const cv =
  $('fw');

const ctx =
  cv.getContext('2d');

let W=0;
let H=0;

let rockets=[];
let parts=[];

let fwOn=false;

let lastT=0;
let nextT=0;


function sizeCanvas(){

  const d =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  W =
    innerWidth;

  H =
    innerHeight;

  cv.width =
    W*d;

  cv.height =
    H*d;

  ctx.setTransform(
    d,
    0,
    0,
    d,
    0,
    0
  );

}


addEventListener(
  'resize',
  sizeCanvas
);


function launch(x){

  const g =
    .16 * H / 800 + .02;

  const apex =
    rand(.42,.78) * H;

  rockets.push({

    x:
      x == null
        ? rand(W*.1,W*.9)
        : x,

    y:
      H+10,

    vx:
      rand(-.6,.6),

    vy:
      -Math.sqrt(
        2*g*apex
      ),

    g,

    hue:
      rand(0,360)

  });

}


function explode(
  x,
  y,
  hue
){

  const sc =
    Math.min(
      Math.max(
        H/800,
        .6
      ),
      1.2
    );

  const n =
    W < 600
      ? 80
      : 120;

  const shape =
    Math.random();


  for(
    let i=0;
    i<n;
    i++
  ){

    let vx;
    let vy;

    const a =
      i/n *
      Math.PI*2;


    if(shape < .2){

      vx =
        16 *
        Math.pow(
          Math.sin(a),
          3
        ) *
        .26 *
        sc;

      vy =
        -(
          13*Math.cos(a)
          -5*Math.cos(2*a)
          -2*Math.cos(3*a)
          -Math.cos(4*a)
        ) *
        .26 *
        sc;

    }

    else if(shape < .45){

      vx =
        Math.cos(a) *
        4.2 *
        sc;

      vy =
        Math.sin(a) *
        4.2 *
        sc;

    }

    else{

      const s =
        rand(.6,1) *
        5.4 *
        sc;

      const b =
        rand(
          0,
          Math.PI*2
        );

      vx =
        Math.cos(b) *
        s;

      vy =
        Math.sin(b) *
        s;

    }


    parts.push({

      x,
      y,
      vx,
      vy,

      life:1,

      decay:
        rand(
          .008,
          .016
        ),

      hue:
        Math.random() < .2
          ? 45
          : hue + rand(-25,25),

      size:
        rand(1.3,2.5),

      l:
        rand(55,78),

      fr:.968,

      g:.035*sc,

      tw:
        Math.random()<.3

    });

  }

}


function frame(t){

  if(!fwOn) return;

  const k =
    Math.min(
      (t-lastT)/16.7,
      2.5
    ) || 1;

  lastT=t;


  ctx.globalCompositeOperation =
    'destination-out';

  ctx.fillStyle =
    'rgba(0,0,0,.22)';

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  ctx.globalCompositeOperation =
    'lighter';


  if(t > nextT){

    launch();

    if(
      Math.random()<.4
    ){

      setTimeout(
        () =>
          fwOn &&
          launch(),
        200
      );

    }

    nextT =
      t +
      rand(
        450,
        1200
      );

  }


  rockets =
    rockets.filter(
      r => {

        r.x +=
          r.vx*k;

        r.y +=
          r.vy*k;

        r.vy +=
          r.g*k;


        parts.push({

          x:r.x,
          y:r.y,

          vx:
            rand(-.3,.3),

          vy:
            rand(.2,.8),

          life:1,

          decay:.06,

          hue:40,

          size:1.6,

          l:80,

          fr:.95,

          g:0,

          tw:false

        });


        ctx.fillStyle =
          '#ffe9b8';

        ctx.beginPath();

        ctx.arc(
          r.x,
          r.y,
          2,
          0,
          6.3
        );

        ctx.fill();


        if(
          r.vy >= -.6
        ){

          explode(
            r.x,
            r.y,
            r.hue
          );

          return false;

        }

        return true;

      }
    );


  ctx.lineCap =
    'round';


  parts =
    parts.filter(
      p => {

        p.vx *=
          Math.pow(
            p.fr,
            k
          );

        p.vy =
          p.vy *
          Math.pow(
            p.fr,
            k
          ) +
          p.g*k;

        p.x +=
          p.vx*k;

        p.y +=
          p.vy*k;

        p.life -=
          p.decay*k;


        if(
          p.life <= 0
        ){

          return false;

        }


        const al =
          p.life *
          (
            p.tw
              ? rand(.4,1)
              : 1
          );


        ctx.strokeStyle =
          `hsla(
            ${p.hue},
            100%,
            ${p.l}%,
            ${al}
          )`;

        ctx.lineWidth =
          p.size;


        ctx.beginPath();

        ctx.moveTo(
          p.x-p.vx*1.6,
          p.y-p.vy*1.6
        );

        ctx.lineTo(
          p.x,
          p.y
        );

        ctx.stroke();


        return true;

      }
    );


  requestAnimationFrame(frame);

}


function startFW(){

  if(fwOn) return;

  sizeCanvas();

  fwOn=true;

  lastT =
    performance.now();

  nextT =
    lastT+300;

  requestAnimationFrame(frame);

}


function stopFW(){

  fwOn=false;

  rockets=[];

  parts=[];

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

}


/* =====================================================
   PAGE 2 TITLE
   ===================================================== */

function setTitle(text){

  const t =
    $('p2title');

  t.textContent =
    text;

  t.classList.remove(
    'pop'
  );

  void t.offsetWidth;

  t.classList.add(
    'pop'
  );

}


function startSurprise(){

  startFW();

  setTimeout(
    () => {

      $('p2title')
        .classList
        .add('up');

      $('stage')
        .classList
        .add('show');

    },
    3800
  );

}


/* =====================================================
   FIRE BUTTON
   ===================================================== */

let lit=false;


$('fire')
.addEventListener(
  'click',
  () => {

    if(lit) return;

    lit=true;

    $('cake')
      .classList
      .add('lit');

    $('fire').disabled =
      true;

    setTitle(
      CONFIG.wishText
    );


    [.3,.7,.5]
      .forEach(
        (p,i) => {

          setTimeout(
            () =>
              fwOn &&
              launch(W*p),
            i*250
          );

        }
      );


    setTimeout(
      () =>
        $('next')
          .classList
          .add('show'),
      1100
    );

  }
);


/* =====================================================
   NEXT BUTTON
   ===================================================== */

$('next')
.addEventListener(
  'click',
  () => {

    go('p3');

    setTimeout(
      stopFW,
      1000
    );

  }
);

</script>
